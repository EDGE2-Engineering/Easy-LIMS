name: Build and Publish Docker Image to GitHub Container Registry (GHCR)

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to checkout and build Docker image from'
        required: true
        default: 'main'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up QEMU (for multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (secrets.DOCKER_HUB_TOKEN != '' || secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_HUB_PASSWORD != '')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER || secrets.DOCKERHUB_USER || secrets.DOCKER_HUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKER_HUB_TOKEN || secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKER_HUB_USER || secrets.DOCKERHUB_USER || secrets.DOCKER_HUB_USERNAME || github.repository_owner }}/easy-lims
          tags: |
            type=raw,value=latest,enable=${{ (inputs.branch || github.ref_name) == 'main' }}
            type=raw,value=${{ inputs.branch }},enable=${{ inputs.branch != '' && inputs.branch != 'main' }}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
